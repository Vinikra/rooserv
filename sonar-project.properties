sonar.projectKey=Vinikra_rooserv
sonar.organization=vinikra
sonar.projectName=RooServ - Plataforma Hiperlocal
sonar.projectVersion=1.0.0

# Codificação
sonar.sourceEncoding=UTF-8

# Diretórios de Código Fonte a serem analisados
sonar.sources=apps/mobile/src,packages/shared/src,supabase

# Exclusões (Ignorar builds, dependências e temporários)
sonar.exclusions=**/node_modules/**,**/dist/**,**/.vercel/**,**/.system_generated/**,**/scratch/**,**/*.mjs

# Definições de TypeScript / React
sonar.typescript.tsconfigPath=apps/mobile/tsconfig.json
