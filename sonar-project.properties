# ==============================================================================
# ROOSERV - CONFIGURAÇÃO DO SONARQUBE LOCAL
# ==============================================================================

sonar.projectKey=RooServ
sonar.projectName=RooServ
sonar.projectVersion=1.0.0

# Host local. A autenticação deve vir de SONAR_TOKEN no ambiente/CI.
sonar.host.url=http://localhost:9000

# Codificação
sonar.sourceEncoding=UTF-8

# Fontes a serem analisadas
sonar.sources=apps/mobile/src,packages/shared/src,supabase

# Exclusões de arquivos de build e testes
sonar.exclusions=**/node_modules/**,**/dist/**,**/.vercel/**,**/.system_generated/**,**/scratch/**,**/*.mjs,**/*.test.ts,**/*.spec.ts

# Testes e Relatório de Cobertura LCOV
sonar.tests=packages/shared/src/__tests__
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
